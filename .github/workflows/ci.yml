name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - '!**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: 3

jobs:
  ci:
    name: Lint, build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check vulnerabilities
        run: npm audit --omit dev

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test

      # Packs every package and consumes each from its own throwaway project: a green build
      # says the bundles compile, not that the published artifacts are usable. `--docker`
      # also installs png-renderer in Linux containers (glibc on Node 22, musl on Node 24).
      - name: Test the packaged packages
        run: npm run test:pack -- --docker

      - name: Generate test coverage
        run: npm run test:coverage

      - name: Upload test coverage
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # The Playwright container must match the installed Playwright exactly, or
  # `browserType.launch` fails with "Executable doesn't exist". A job cannot read its own
  # container tag from the repo (the container starts before any step runs), so resolve it
  # here and hand it to the next job. The version comes from the lockfile, which is what
  # `npm ci` installs. The same as in the Pages workflow and `npm run test:e2e:docker`.
  container-image:
    name: Resolve Playwright image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve Playwright image
        id: resolve
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/playwright']?.version ?? ''")"
          if [ -z "$version" ]; then
            echo "::error::Could not read the playwright version from package-lock.json"
            exit 1
          fi
          echo "image=mcr.microsoft.com/playwright:v${version}-noble" >> "$GITHUB_OUTPUT"

  # In the Playwright container, as the Pages workflow and `npm run test:e2e:docker`: the
  # screenshots measure the same numbers in all three.
  e2e:
    name: E2E tests
    needs: container-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.container-image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run E2E tests
        id: e2e
        run: npm run test:e2e

      # A failed E2E run skips the Pages workflow, which publishes the report otherwise:
      # keep the screenshots and diffs, to see what differs.
      - name: Upload E2E report
        uses: actions/upload-artifact@v7
        if: failure() && steps.e2e.outcome == 'failure'
        with:
          name: e2e-report
          path: e2e/output/
          retention-days: 30
