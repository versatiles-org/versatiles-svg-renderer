name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - '!**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: 3

jobs:
  ci:
    name: Lint, build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check vulnerabilities
        run: npm audit --omit dev

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test

      # Packs every package and consumes each from its own throwaway project: a green build
      # says the bundles compile, not that the published artifacts are usable. `--docker`
      # also installs png-renderer in Linux containers (glibc on Node 22, musl on Node 24).
      - name: Test the packaged packages
        run: npm run test:pack -- --docker

      - name: Run MapLibre plugin E2E test
        id: e2e
        run: npm run test:e2e

      # A failed E2E run skips the Pages workflow, which publishes the report otherwise:
      # keep the screenshots and diffs, to see what differs on Linux.
      - name: Upload E2E report
        uses: actions/upload-artifact@v7
        if: failure() && steps.e2e.outcome == 'failure'
        with:
          name: e2e-report
          path: e2e/output/
          retention-days: 30

      - name: Generate test coverage
        run: npm run test:coverage

      - name: Upload test coverage
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
