<svg xmlns="http://www.w3.org/2000/svg" width="163" height="190" viewBox="0 0 163 190">
<title>Dependency graph</title>
<style>
	.background { fill: #ffffff; }
	.directory { stroke: #c5ccc9; stroke-width: 1; }
	.depth1 { fill: #f2f4f3; }
	.depth2 { fill: #e8ecea; }
	.depth3 { fill: #dfe4e2; }
	.file { fill: #ffffff; stroke: #9aa6a1; stroke-width: 1; }
	text { font-family: Helvetica, Arial, 'Liberation Sans', sans-serif; font-size: 12px; }
	.label { fill: #1b2220; text-anchor: middle; }
	.directory-label { fill: #66736d; font-weight: 600; }
	.edge { fill: none; stroke: #5f6b66; stroke-width: 1; stroke-opacity: 0.7; }
	.arrowhead { fill: #5f6b66; }
	svg { --outgoing: #d9480f; --incoming: #1971c2; }
	.background, .edge { pointer-events: none; }
	.node { cursor: default; }
	.node:hover .file { stroke-width: 2; }
	.arrowhead-dim { fill: #5f6b66; fill-opacity: 0.15; }
	.arrowhead-outgoing { fill: var(--outgoing); }
	.arrowhead-incoming { fill: var(--incoming); }
	@media (prefers-color-scheme: dark) {
		svg { --outgoing: #ff922b; --incoming: #4dabf7; }
		.arrowhead-dim { fill: #8b949e; }
		.background { fill: #0d1117; }
		.directory { stroke: #39424d; }
		.depth1 { fill: #161b22; }
		.depth2 { fill: #1c232c; }
		.depth3 { fill: #232b35; }
		.file { fill: #0d1117; stroke: #5c6773; }
		.label { fill: #e6edf3; }
		.directory-label { fill: #8b949e; }
		.edge { stroke: #8b949e; }
		.arrowhead { fill: #8b949e; }
	}
	svg:has(.node:hover) .edge { stroke-opacity: 0.15; marker-end: url(#arrow-dim); }
	svg:has(.n3:hover) .inner-n3 { stroke-opacity: 0.7; marker-end: url(#arrow); }
	svg:has(.n1:hover) .from-n1, svg:has(.n2:hover) .from-n2 { stroke: var(--outgoing); stroke-opacity: 1; marker-end: url(#arrow-outgoing); }
	svg:has(.n2:hover) .to-n2, svg:has(.n0:hover) .to-n0 { stroke: var(--incoming); stroke-opacity: 1; marker-end: url(#arrow-incoming); }
	svg:has(.n1:hover) .n2 .file, svg:has(.n2:hover) .n0 .file { stroke: var(--outgoing); }
	svg:has(.n2:hover) .n1 .file, svg:has(.n0:hover) .n2 .file { stroke: var(--incoming); }
	svg:has(.n3:hover) .directory.n3 { stroke-width: 2; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path class="arrowhead" d="M0,0 L8,4 L0,8 z"/></marker>
<marker id="arrow-dim" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path class="arrowhead-dim" d="M0,0 L8,4 L0,8 z"/></marker>
<marker id="arrow-outgoing" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path class="arrowhead-outgoing" d="M0,0 L8,4 L0,8 z"/></marker>
<marker id="arrow-incoming" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path class="arrowhead-incoming" d="M0,0 L8,4 L0,8 z"/></marker>
</defs>
<rect class="background" width="163" height="190"/>
<rect class="directory depth1 node n3" x="12" y="12" width="138.72" height="166" rx="6"/>
<g class="node n0">
<rect class="file" x="22" y="144" width="118.72" height="24" rx="4"/>
<text class="label" x="81.36" y="160" textLength="102.72" lengthAdjust="spacingAndGlyphs">canvas_backend.ts</text>
</g>
<g class="node n1">
<rect class="file" x="52" y="40" width="57.35" height="24" rx="4"/>
<text class="label" x="80.68" y="56" textLength="41.35" lengthAdjust="spacingAndGlyphs">index.ts</text>
</g>
<g class="node n2">
<rect class="file" x="57" y="92" width="48.69" height="24" rx="4"/>
<text class="label" x="81.34" y="108" textLength="32.69" lengthAdjust="spacingAndGlyphs">png.ts</text>
</g>
<path class="edge from-n1 to-n2 inner-n3" d="M81,64 L81,92" marker-end="url(#arrow)"/>
<path class="edge from-n2 to-n0 inner-n3" d="M81,116 L81,144" marker-end="url(#arrow)"/>
<g class="node n3">
<rect class="depth1" x="19" y="16" width="24.01" height="16" rx="2"/>
<text class="directory-label" x="22" y="28" textLength="18.01" lengthAdjust="spacingAndGlyphs">src</text>
</g>
</svg>
